name: Build Command Quest APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'commandquest/**'
      - '.github/workflows/commandquest-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Command Quest APK
        run: gradle -p commandquest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CommandQuest-apk
          path: commandquest/app/build/outputs/apk/debug/app-debug.apk
