name: TabLink Boxlight Android APK
on:
  push:
    branches: [tablink-boxlight-deploy]
    paths:
      - 'board-android/**'
      - '.github/workflows/tablink-board-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK platform
        run: |
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK (temporary test signature)
        run: gradle --no-daemon -p board-android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TabLink-Board-test-APK
          path: board-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish public test APK for easy on-board installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create tablink-board-test-v0.7 \
            "board-android/app/build/outputs/apk/debug/app-debug.apk#TabLink-Board-test-v0.7.apk" \
            --target "$GITHUB_SHA" --title "TabLink Board 0.7 diagnostic" \
            --notes "Experimental Android 8+ Boxlight receiver. Not a finished iPhone broadcast solution. Built for testing WebRTC/decoder support. Verify the APK before installing on a managed school device."
